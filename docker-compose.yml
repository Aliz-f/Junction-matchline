services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: matchline
      POSTGRES_USER: matchline
      POSTGRES_PASSWORD: ${MATCHLINE_POSTGRES_PASSWORD:?set in local .env}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchline -d matchline"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - matchline-postgres:/var/lib/postgresql/data
  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://matchline:${MATCHLINE_POSTGRES_PASSWORD:?set in local .env}@postgres:5432/matchline
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
volumes:
  matchline-postgres:
