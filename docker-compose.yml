services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: matchline
      POSTGRES_USER: matchline
      POSTGRES_PASSWORD: ${MATCHLINE_POSTGRES_PASSWORD:?set MATCHLINE_POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchline -d matchline"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - matchline-postgres:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    environment: &backend-environment
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://matchline:${MATCHLINE_POSTGRES_PASSWORD:?set MATCHLINE_POSTGRES_PASSWORD in .env}@postgres:5432/matchline
      FRONTEND_ORIGIN: ${MATCHLINE_FRONTEND_ORIGIN:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${MATCHLINE_FRONTEND_ORIGIN:-http://localhost:3000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SPORTS_PROVIDER: demo
      AI_PROVIDER: mock
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: ./backend
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        MATCHLINE_API_BASE_URL: http://api:8000
    environment:
      MATCHLINE_API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  matchline-postgres:
