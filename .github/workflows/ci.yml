name: Application CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.14"
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -r requirements.lock
      - run: .venv/bin/ruff check .
      - run: .venv/bin/mypy --config-file pyproject.toml
      - run: .venv/bin/python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose deployment configuration
        env:
          MATCHLINE_POSTGRES_PASSWORD: ci-only-not-a-secret
          MATCHLINE_FRONTEND_ORIGIN: http://localhost:3000
        run: docker compose config --quiet
      - name: Build deployment images
        run: docker compose build
